services:
  # ── Vite dev server (make dev) — the real app, not the Hello World anymore.
  dev:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "4321:4321"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 4321"

  # ── One-off node commands: test, build, install (make test / make build) ────
  node:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      CI: "true"

  # ── Pulumi — CI does all provisioning/deploys via OIDC, not this. Locally,
  # using `make infra-preview` etc. would need AWS keys added to .env too,
  # which by default it doesn't have (see .env.example -- Pulumi token only,
  # on purpose). The AWS_* vars below aren't for local use -- they're what
  # let CI's OIDC-assumed credentials (set as env vars by configure-aws-
  # credentials on the runner) actually reach this container; Compose doesn't
  # forward the host/runner environment automatically, only what's named here.
  pulumi:
    build: ./infra/pulumi
    working_dir: /infra
    volumes:
      - ./infra/pulumi:/infra
      - pulumi_plugins:/root/.pulumi/plugins
    env_file:
      - path: .env
        required: false
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      PULUMI_ACCESS_TOKEN: ${PULUMI_ACCESS_TOKEN:-}
      PULUMI_STACK: ${PULUMI_STACK:-prod}

  # ── S3 sync + CloudFront invalidation (make deploy) -- this is what
  # deploy-site.yml actually runs in CI. Same "empty by default, OIDC fills
  # it in CI" pattern as the pulumi service above.
  awscli:
    image: amazon/aws-cli:2.17.0
    volumes:
      - .:/app
    working_dir: /app
    env_file:
      - path: .env
        required: false
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}

volumes:
  pulumi_plugins:
  node_modules:
